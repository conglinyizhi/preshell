name: check

# 三件事各自防一类退化：
#   moon test           库内行为（含逐命令语义、畸形输入、递归边界）
#   corpus/run.sh       与 bash -n 的差分：四象限不许移动，佐证表不许被证伪
#   probe + fuzz        进程不许死：崩溃、挂死、输出不是合法 JSON 都算失败
#
# 语料随仓库分发（tools/corpus/bash-tests，GPL-3.0-or-later，出处见其 README），
# 所以 CI 不依赖网络，跑的和本地一致。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        # 新装的工具链带的注册表索引是旧的，直接 build 会报
        # "module was not found in the registry"（moonbitlang/async）。
        # 本地环境早就更新过，所以只有 CI 会碰这个。
        run: moon update

      - name: MoonBit CI engine
        run: moon run --target native tools/ci/check.mbtx
