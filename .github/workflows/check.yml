name: check

# 三件事各自防一类退化：
#   moon test           库内行为（含逐命令语义、畸形输入、递归边界）
#   corpus/run.sh       与 bash -n 的差分：四象限不许移动，佐证表不许被证伪
#   probe + fuzz        进程不许死：崩溃、挂死、输出不是合法 JSON 都算失败
#
# 语料随仓库分发（tools/corpus/bash-tests，GPL-3.0-or-later，出处见其 README），
# 所以 CI 不依赖网络，跑的和本地一致。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        # 缓存键要跟工具链走：每夜版换了产物就可能不兼容，拿旧缓存去增量反而出
        # 假失败。版本要在装完之后才拿得到，所以单独一步。
        id: toolchain
        run: echo "version=$(moon version --all | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache the build directory
        # 两处收益：依赖（moonbitlang/async 那个大包）不用重编，源文件改动后
        # restore-keys 会给一份旧产物做增量。_build 约 65M。
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('moon.mod') }}
          restore-keys: |
            build-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-

      - name: Update registry
        # 新装的工具链带的注册表索引是旧的，直接 build 会报
        # "module was not found in the registry"（moonbitlang/async）。
        # 本地环境早就更新过，所以只有 CI 会碰这个。
        run: moon update

      - name: MoonBit CI engine
        run: moon run --target native tools/ci/check.mbtx
