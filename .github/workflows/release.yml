name: release

# 打 tag 即发版：构建、跑测试、把二进制挂到 Release 上。
#
# 为什么要留一条 workflow_dispatch：
# tag 触发时 GitHub 用的是**那个 tag 所在提交里的** workflow 文件，所以在
# 本文件出现之前打的 tag 永远不会被自动发出来。dispatch 从默认分支跑，
# 可以按 tag 名补发，也可以重跑一次失败的发布。
#
# 挂二进制就等于分发 GPL 程序，源码义务由同一个仓库承担——tag 与源码一一对应，
# 所以 Release 说明里必须把这条写明，而不是只给一个下载链接。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag 名（已存在的）
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # 读 tag 注解、比对历史都要完整历史，浅克隆拿不到。
          fetch-depth: 0

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        # 新装的工具链带的注册表索引是旧的，先更新 async 依赖索引。
        run: moon update

      - name: MoonBit release engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: moon run --quiet --target native tools/ci/release.mbtx -- "${{ inputs.tag || github.ref_name }}" "${{ github.server_url }}/${{ github.repository }}"
